<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Authenticated internal application — keep it out of public search.
      `noindex` is what actually de-indexes; robots.txt deliberately allows
      crawling so this tag can be read. See public/robots.txt.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <title>Solu1ions Growth OS</title>
    <meta
      name="description"
      content="Internal workspace for Solu1ions Business Development. Sign-in required."
    />
    <meta name="theme-color" content="#f7f8f9" />

    <!--
      SVG favicon covers Chrome, Edge, Firefox and Safari 15+. Transparent on
      purpose so it adapts to light and dark browser chrome.
      TODO: export apple-touch-icon.png at 180x180 — iOS ignores SVG.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
        Runs before first paint so the app never flashes light then repaints
        dark. Must stay in sync with THEME_STORAGE_KEY in ThemeContext.tsx.
        Kept inline and dependency-free on purpose — an external file would
        be fetched after parse and reintroduce the flash.
      */
      (function () {
        try {
          var stored = localStorage.getItem('growth.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0e1116' : '#f7f8f9');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
